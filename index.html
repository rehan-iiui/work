<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkSpace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#edf0f8;--panel:rgba(255,255,255,.66);
  --text:#242638;--muted:#81849a;
  --border:rgba(120,120,150,.15);
  --accent:#7963d9;--soft:#e9e3ff;
}
[data-theme="dark"] {
  --bg:#151621;--panel:rgba(39,40,56,.8);
  --text:#f2f1fa;--muted:#a3a4b8;
  --border:rgba(255,255,255,.09);--accent:#a18cf5;
  --soft:#38304f;
}
*{box-sizing:border-box}
body {
 margin:0;background:var(--bg);color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 min-height:100vh;transition:.25s;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.glass {
 background:var(--panel);backdrop-filter:blur(22px);
 border:1px solid var(--border);border-radius:18px;
 box-shadow:0 8px 30px rgba(30,30,70,.04);
}
#authScreen{
 min-height:100vh;display:grid;place-items:center;padding:20px;
 background:radial-gradient(circle at 20% 20%,#c8c2f5,transparent 40%),
 radial-gradient(circle at 80% 80%,#d9e7ff,transparent 40%),var(--bg);
}
.auth-card{width:min(420px,100%);padding:35px}
.brand{font-size:25px;font-weight:800;letter-spacing:-1px}
.brand span{color:var(--accent)}
.subtitle{color:var(--muted);font-size:13px;margin:8px 0 25px}
input,textarea,select{
 width:100%;padding:12px 14px;border-radius:11px;
 border:1px solid var(--border);background:var(--bg);
 color:var(--text);outline:none;margin:7px 0;
}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:110px;resize:vertical}
.btn{
 padding:11px 17px;border:0;border-radius:11px;
 background:var(--accent);color:white;font-weight:650;
}
.btn.secondary{background:var(--soft);color:var(--accent)}
.btn.danger{background:#dc626c;color:white}
.btn:disabled{opacity:.5;cursor:not-allowed}
.auth-switch{margin-top:18px;color:var(--muted);font-size:13px}
.auth-switch a{color:var(--accent);cursor:pointer}
#app{display:flex;min-height:100vh;padding:14px;gap:14px}
.sidebar{
 width:235px;padding:20px 14px;flex-shrink:0;
 display:flex;flex-direction:column;gap:8px;
}
.side-brand{padding:5px 10px 22px}
.side-label{font-size:10px;font-weight:800;letter-spacing:1.3px;
 color:var(--muted);padding:16px 10px 6px}
.nav{
 border:0;background:transparent;color:var(--muted);
 text-align:left;padding:12px;border-radius:11px;
 font-size:13px;display:flex;gap:12px;align-items:center;
}
.nav:hover,.nav.active{background:var(--soft);color:var(--accent)}
.sidebar-bottom{margin-top:auto}
.main{flex:1;min-width:0;padding:8px 12px 25px}
.topbar{display:flex;align-items:center;justify-content:space-between;
 padding:10px 5px 24px;gap:12px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{border:1px solid var(--border);background:var(--panel);
 color:var(--text);padding:10px 13px;border-radius:12px}
.page-title{font-size:27px;font-weight:750;letter-spacing:-.8px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{padding:20px;min-width:0}
.stat{font-size:29px;font-weight:800;margin-top:9px}
.stat-label{font-size:12px;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;
 align-items:center;gap:10px;margin:23px 0 12px}
.section-head h3{margin:0;font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.list{display:grid;gap:10px}
.item{padding:15px;display:flex;align-items:center;
 justify-content:space-between;gap:12px}
.item strong{font-size:13px}
.item small{display:block;color:var(--muted);margin-top:5px}
.item-actions{display:flex;gap:6px}
.small-btn{padding:7px 10px;border:1px solid var(--border);
 background:var(--bg);color:var(--text);border-radius:8px}
.badge{font-size:10px;padding:5px 8px;border-radius:20px;
 background:var(--soft);color:var(--accent)}
.form-row{display:flex;gap:9px}
.form-row>*{flex:1;min-width:0}
.empty{padding:35px;text-align:center;color:var(--muted)}
.timer{text-align:center;padding:40px}
.timer-display{font-size:65px;font-weight:800;letter-spacing:-3px;
 margin:25px 0}
.editor{min-height:300px}
.progress{height:7px;background:var(--soft);border-radius:10px;
 overflow:hidden;margin-top:12px}
.progress>div{height:100%;background:var(--accent)}
.pro-banner{
 padding:26px;border-radius:20px;
 background:linear-gradient(120deg,#30254f,#7862cf);
 color:white;margin-top:18px;
}
.pro-banner p{color:#e1dafa;font-size:13px}
.mobile-menu{display:none}
@media(max-width:850px){
 #app{padding:8px}.sidebar{width:190px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:620px){
 #app{display:block}.sidebar{
 position:fixed;z-index:5;left:8px;top:8px;bottom:8px;
 width:245px;transform:translateX(-115%);transition:.2s;
 }
 .sidebar.open{transform:translateX(0)}
 .mobile-menu{display:inline-block}
 .main{padding:8px}
 .grid{grid-template-columns:1fr}
 .page-title{font-size:23px}
}
</style>
</head>
<body>

<!-- AUTHENTICATION -->
<section id="authScreen">
 <div class="auth-card glass">
  <div class="brand">Work<span>Space</span></div>
  <div class="subtitle">Your work. Your space. Your productivity.</div>
  <h2 id="authTitle">Welcome back</h2>
  <div id="nameField" class="hidden">
   <label class="muted">Your name</label>
   <input id="displayName" placeholder="Your name">
  </div>
  <label class="muted">Email address</label>
  <input id="email" type="email" placeholder="you@example.com">
  <label class="muted">Password</label>
  <input id="password" type="password" placeholder="Your password">
  <button class="btn" id="authButton" style="width:100%;margin-top:12px"
   onclick="submitAuth()">Sign in</button>
  <div class="auth-switch">
   <span id="switchText">New to WorkSpace?</span>
   <a onclick="toggleAuth()" id="switchLink">Create an account</a>
  </div>
  <p id="authMessage" class="muted" style="font-size:12px"></p>
 </div>
</section>

<!-- MAIN APP -->
<div id="app" class="hidden">
 <aside class="sidebar glass" id="sidebar">
  <div class="side-brand">
   <div class="brand">Work<span>Space</span></div>
   <small class="muted">Personal workspace</small>
  </div>
  <div class="side-label">WORKSPACE</div>
  <button class="nav active" data-page="overview">⌂ Overview</button>
  <button class="nav" data-page="projects">▦ Projects</button>
  <button class="nav" data-page="tasks">☑ My Tasks</button>
  <button class="nav" data-page="documents">▤ Documents</button>
  <button class="nav" data-page="focus">◷ Focus Timer</button>
  <button class="nav" data-page="resources">◇ Resources</button>
  <div class="side-label">MANAGEMENT</div>
  <button class="nav" data-page="team">♧ Team Spaces · PRO</button>
  <button class="nav" data-page="analytics">▥ Analytics</button>
  <button class="nav" data-page="ai">✧ AI Assistant · PRO</button>
  <div class="sidebar-bottom">
   <button class="nav" data-page="billing">♛ Upgrade to Pro</button>
   <button class="nav" data-page="settings">⚙ Settings</button>
   <button class="nav" onclick="signOut()">↪ Sign out</button>
  </div>
 </aside>

 <main class="main">
  <header class="topbar">
   <div class="row">
    <button class="icon-btn mobile-menu" onclick="toggleMenu()">☰</button>
    <div>
     <div class="page-title" id="pageTitle">Overview</div>
     <small class="muted" id="dateText"></small>
    </div>
   </div>
   <div class="top-actions">
    <span class="badge" id="planBadge">FREE PLAN</span>
    <button class="icon-btn" onclick="toggleTheme()">◐</button>
   </div>
  </header>
  <section id="content"></section>
 </main>
</div>

<script>
/* CONFIGURATION */
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

let db;
let currentUser = null;
let profile = null;
let subscription = {plan:"free",status:"inactive"};
let currentPage = "overview";
let authMode = "login";
let timerInterval = null;
let seconds = 1500;
let running = false;

const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g,
 c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isPro = () => subscription.plan === "pro" &&
 subscription.status === "active" &&
 (!subscription.current_period_end ||
 new Date(subscription.current_period_end) > new Date());

function notify(message){
 alert(message);
}

async function init(){
 if(SUPABASE_URL.startsWith("YOUR_") ||
 SUPABASE_KEY.startsWith("YOUR_")){
  $("authMessage").textContent =
  "Add your Supabase URL and publishable key in the code first.";
  return;
 }
 db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 db.auth.onAuthStateChange((_event,session)=>{
  if(session?.user) setTimeout(()=>loadApp(session.user),0);
  else {
   currentUser=null;
   $("app").classList.add("hidden");
   $("authScreen").classList.remove("hidden");
  }
 });
 const {data:{session}} = await db.auth.getSession();
 if(session) await loadApp(session.user);
}

function toggleAuth(){
 authMode = authMode === "login" ? "signup" : "login";
 $("authTitle").textContent = authMode==="login"?"Welcome back":"Create your account";
 $("authButton").textContent = authMode==="login"?"Sign in":"Create account";
 $("nameField").classList.toggle("hidden",authMode==="login");
 $("switchText").textContent=authMode==="login"?"New to WorkSpace?":"Already have an account?";
 $("switchLink").textContent=authMode==="login"?"Create an account":"Sign in";
 $("authMessage").textContent="";
}

async function submitAuth(){
 const email=$("email").value.trim();
 const password=$("password").value;
 const name=$("displayName").value.trim();
 if(!email || password.length<8){
  $("authMessage").textContent="Enter an email and a password of at least 8 characters.";
  return;
 }
 $("authButton").disabled=true;
 try{
  if(authMode==="signup"){
   const {data,error}=await db.auth.signUp({
    email,password,
    options:{data:{display_name:name}}
   });
   if(error) throw error;
   $("authMessage").textContent=data.session?
    "Account created!":"Check your email to confirm your account.";
  }else{
   const {error}=await db.auth.signInWithPassword({email,password});
   if(error) throw error;
  }
 }catch(e){$("authMessage").textContent=e.message}
 finally{$("authButton").disabled=false}
}

async function signOut(){
 if(timerInterval) clearInterval(timerInterval);
 await db.auth.signOut();
}

async function loadApp(user){
 currentUser=user;
 $("authScreen").classList.add("hidden");
 $("app").classList.remove("hidden");
 const {data:p}=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();
 profile=p;
 await refreshSubscription();
 $("dateText").textContent=new Date().toLocaleDateString(undefined,
 {weekday:"long",year:"numeric",month:"long",day:"numeric"});
 navigate(currentPage);
}

async function refreshSubscription(){
 const {data,error}=await db.from("subscriptions").select("*")
 .eq("user_id",currentUser.id).maybeSingle();
 if(!error && data) subscription=data;
 $("planBadge").textContent=isPro()?"PRO PLAN":"FREE PLAN";
}

async function rows(table,order="created_at"){
 const {data,error}=await db.from(table).select("*")
 .order(order,{ascending:false});
 if(error) throw error;
 return data||[];
}

async function addRow(table,values){
 const {error}=await db.from(table).insert({...values,user_id:currentUser.id});
 if(error) throw error;
}

async function removeRow(table,id){
 const {error}=await db.from(table).delete().eq("id",id);
 if(error) throw error;
 navigate(currentPage);
}

function navigate(page){
 currentPage=page;
 $("sidebar").classList.remove("open");
 document.querySelectorAll(".nav[data-page]").forEach(b=>
  b.classList.toggle("active",b.dataset.page===page));
 const names={
 overview:"Overview",projects:"Projects",tasks:"My Tasks",
 documents:"Documents",focus:"Focus Timer",resources:"Resources",
 team:"Team Spaces",analytics:"Analytics",ai:"AI Assistant",
 billing:"Plans & Billing",settings:"Settings"
 };
 $("pageTitle").textContent=names[page]||"WorkSpace";
 renderPage();
}

document.querySelectorAll(".nav[data-page]").forEach(b=>
 b.addEventListener("click",()=>navigate(b.dataset.page)));

async function renderPage(){
 const content=$("content");
 content.innerHTML='<div class="empty">Loading your workspace...</div>';
 try{
  if(currentPage==="overview") await renderOverview();
  if(currentPage==="projects") await renderProjects();
  if(currentPage==="tasks") await renderTasks();
  if(currentPage==="documents") await renderDocuments();
  if(currentPage==="resources") await renderResources();
  if(currentPage==="focus") renderFocus();
  if(currentPage==="analytics") await renderAnalytics();
  if(currentPage==="billing") renderBilling();
  if(currentPage==="team") renderTeam();
  if(currentPage==="ai") renderAI();
  if(currentPage==="settings") renderSettings();
 }catch(e){content.innerHTML=`<div class="glass card">Error: ${esc(e.message)}</div>`}
}

async function renderOverview(){
 const [projects,tasks,docs]=await Promise.all([
  rows("projects"),rows("tasks"),rows("documents")
 ]);
 const done=tasks.filter(t=>t.status==="done").length;
 $("content").innerHTML=`
 <div class="grid">
  <div class="glass card"><div class="stat-label">Projects</div><div class="stat">${projects.length}</div></div>
  <div class="glass card"><div class="stat-label">Total tasks</div><div class="stat">${tasks.length}</div></div>
  <div class="glass card"><div class="stat-label">Completed tasks</div><div class="stat">${done}</div></div>
 </div>
 <div class="section-head"><h3>Your projects</h3>
 <button class="btn secondary" onclick="navigate('projects')">View all</button></div>
 <div class="list">${projects.slice(0,4).map(p=>`
  <div class="glass item"><div><strong>${esc(p.name)}</strong>
  <small>${esc(p.description)}</small></div><span class="badge">Project</span></div>`).join("")||'<div class="glass empty">Create your first project.</div>'}</div>
 <div class="section-head"><h3>Recent tasks</h3>
 <button class="btn secondary" onclick="navigate('tasks')">View tasks</button></div>
 <div class="list">${tasks.slice(0,5).map(taskCard).join("")||'<div class="glass empty">No tasks yet.</div>'}</div>
 <div class="pro-banner"><h2>Make more room for great work.</h2>
 <p>Explore advanced WorkSpace features with Pro.</p>
 <button class="btn" style="background:white;color:#5946a4" onclick="navigate('billing')">Explore Pro</button></div>`;
}

function taskCard(t){
 return `<div class="glass item"><div><strong>${esc(t.title)}</strong>
 <small>${esc(t.priority)} priority · ${esc(t.status)}</small></div>
 <div class="item-actions">
 <button class="small-btn" onclick="cycleTask('${t.id}','${t.status}')">Next status</button>
 <button class="small-btn" onclick="removeRow('tasks','${t.id}')">Delete</button>
 </div></div>`;
}

async function renderProjects(){
 const data=await rows("projects");
 $("content").innerHTML=`
 <div class="glass card">
  <h3>Create a project</h3>
  <input id="projectName" placeholder="Project name">
  <input id="projectDescription" placeholder="Description">
  <button class="btn" onclick="createProject()">Create project</button>
 </div>
 <div class="section-head"><h3>All projects</h3></div>
 <div class="list">${data.map(p=>`
  <div class="glass item"><div><strong>${esc(p.name)}</strong>
  <small>${esc(p.description)}</small></div>
  <button class="small-btn" onclick="removeRow('projects','${p.id}')">Delete</button></div>
 `).join("")||'<div class="glass empty">Your projects will appear here.</div>'}</div>`;
}

async function createProject(){
 const name=$("projectName").value.trim();
 if(!name)return notify("Enter a project name.");
 const data=await rows("projects");
 if(!isPro() && data.length>=3)
  return notify("Free plan allows 3 projects. Upgrade to Pro for more.");
 try{
  await addRow("projects",{name,description:$("projectDescription").value});
  navigate("projects");
 }catch(e){notify(e.message)}
}

async function renderTasks(){
 const [tasks,projects]=await Promise.all([rows("tasks"),rows("projects")]);
 $("content").innerHTML=`
 <div class="glass card">
  <h3>New task</h3>
  <input id="taskTitle" placeholder="What needs to be done?">
  <div class="form-row">
   <select id="taskProject"><option value="">No project</option>
   ${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
   <select id="taskPriority"><option value="low">Low</option>
   <option value="medium" selected>Medium</option><option value="high">High</option></select>
  </div>
  <input id="taskDue" type="date">
  <button class="btn" onclick="createTask()">Add task</button>
 </div>
 <div class="section-head"><h3>Task board</h3></div>
 <div class="grid">${["todo","doing","done"].map(status=>`
  <div class="glass card"><h3>${status==="todo"?"To do":status==="doing"?"In progress":"Completed"}</h3>
  <div class="list">${tasks.filter(t=>t.status===status).map(taskCard).join("")||'<div class="empty">No tasks</div>'}</div></div>
 `).join("")}</div>`;
}

async function createTask(){
 const title=$("taskTitle").value.trim();
 if(!title)return notify("Enter a task title.");
 const tasks=await rows("tasks");
 if(!isPro() && tasks.length>=100)
  return notify("Free plan allows 100 tasks. Upgrade for more.");
 try{
  await addRow("tasks",{
   title,project_id:$("taskProject").value||null,
   priority:$("taskPriority").value,due_date:$("taskDue").value||null
  });
  navigate("tasks");
 }catch(e){notify(e.message)}
}

async function cycleTask(id,status){
 const next={todo:"doing",doing:"done",done:"todo"}[status];
 const {error}=await db.from("tasks").update({status:next}).eq("id",id);
 if(error)return notify(error.message);
 navigate(currentPage);
}

async function renderDocuments(){
 const docs=await rows("documents","updated_at");
 $("content").innerHTML=`
 <div class="glass card">
  <h3>Create document</h3>
  <input id="docTitle" placeholder="Document title">
  <textarea id="docContent" placeholder="Write your ideas, notes or meeting summary..."></textarea>
  <button class="btn" onclick="createDocument()">Save document</button>
 </div>
 <div class="section-head"><h3>Your documents</h3></div>
 <div class="list">${docs.map(d=>`
  <div class="glass item"><div><strong>${esc(d.title)}</strong>
  <small>${esc(d.content.slice(0,100))}</small></div>
  <div class="item-actions">
  <button class="small-btn" onclick="editDocument('${d.id}')">Edit</button>
  <button class="small-btn" onclick="removeRow('documents','${d.id}')">Delete</button>
  </div></div>`).join("")||'<div class="glass empty">No documents yet.</div>'}</div>`;
}

async function createDocument(){
 const title=$("docTitle").value.trim()||"Untitled";
 const content=$("docContent").value;
 try{
  await addRow("documents",{title,content});
  navigate("documents");
 }catch(e){notify(e.message)}
}

async function editDocument(id){
 const {data,error}=await db.from("documents").select("*").eq("id",id).single();
 if(error)return notify(error.message);
 const title=prompt("Document title:",data.title);
 if(title===null)return;
 const content=prompt("Document content:",data.content);
 if(content===null)return;
 const {error:updateError}=await db.from("documents").update({
  title,content,updated_at:new Date().toISOString()
 }).eq("id",id);
 if(updateError)return notify(updateError.message);
 navigate("documents");
}

async function renderResources(){
 const data=await rows("resources");
 $("content").innerHTML=`
 <div class="glass card"><h3>Save a resource</h3>
 <input id="resourceTitle" placeholder="Resource name">
 <input id="resourceUrl" type="url" placeholder="https://example.com">
 <button class="btn" onclick="createResource()">Save resource</button></div>
 <div class="section-head"><h3>Saved resources</h3></div>
 <div class="list">${data.map(r=>`
 <div class="glass item"><div><strong>${esc(r.title)}</strong>
 <small>${esc(r.url||"")}</small></div>
 <div class="item-actions">
 ${r.url?`<button class="small-btn" onclick="window.open('${esc(r.url)}','_blank','noopener')">Open</button>`:""}
 <button class="small-btn" onclick="removeRow('resources','${r.id}')">Delete</button>
 </div></div>`).join("")||'<div class="glass empty">No saved resources.</div>'}</div>`;
}

async function createResource(){
 const title=$("resourceTitle").value.trim();
 const url=$("resourceUrl").value.trim();
 if(!title)return notify("Enter a resource name.");
 if(url && !/^https?:\/\//i.test(url))return notify("Use a valid HTTP or HTTPS link.");
 try{await addRow("resources",{title,url});navigate("resources")}
 catch(e){notify(e.message)}
}

function renderFocus(){
 $("content").innerHTML=`
 <div class="glass timer">
 <span class="badge">FOCUS SESSION</span>
 <div class="timer-display" id="timerDisplay">25:00</div>
 <p class="muted">Take one task at a time. Focus on doing good work.</p>
 <button class="btn" onclick="startTimer()">Start</button>
 <button class="btn secondary" onclick="pauseTimer()">Pause</button>
 <button class="btn secondary" onclick="resetTimer()">Reset</button>
 </div>`;
 updateTimerDisplay();
}

function updateTimerDisplay(){
 const el=$("timerDisplay");
 if(el)el.textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
}
function startTimer(){
 if(running)return;
 running=true;
 timerInterval=setInterval(()=>{
  if(seconds>0){seconds--;updateTimerDisplay()}
  else{pauseTimer();notify("Focus session complete!")}
 },1000);
}
function pauseTimer(){
 running=false;
 if(timerInterval)clearInterval(timerInterval);
 timerInterval=null;
}
function resetTimer(){
 pauseTimer();seconds=1500;updateTimerDisplay();
}

async function renderAnalytics(){
 const [projects,tasks,docs]=await Promise.all([
  rows("projects"),rows("tasks"),rows("documents")
 ]);
 const done=tasks.filter(t=>t.status==="done").length;
 const pct=tasks.length?Math.round(done/tasks.length*100):0;
 $("content").innerHTML=`
 <div class="grid">
  <div class="glass card"><div class="stat-label">Projects created</div><div class="stat">${projects.length}</div></div>
  <div class="glass card"><div class="stat-label">Documents saved</div><div class="stat">${docs.length}</div></div>
  <div class="glass card"><div class="stat-label">Tasks completed</div><div class="stat">${done}</div></div>
 </div>
 <div class="glass card" style="margin-top:15px">
  <h3>Task completion</h3><div class="stat">${pct}%</div>
  <div class="progress"><div style="width:${pct}%"></div></div>
  <p class="muted">${done} completed out of ${tasks.length} tasks.</p>
 </div>

function toggleTheme(){
 const next=document.documentElement.dataset.theme==="dark"?"light":"dark";
 document.documentElement.dataset.theme=next;
 localStorage.setItem("workspace-theme",next);
}

const savedTheme=localStorage.getItem("workspace-theme");
if(savedTheme)document.documentElement.dataset.theme=savedTheme;
